# XCcv 随包模板：YOLO11 小目标 P2 头检测模型（P2/4 - P5/32 四层输出）。
#
# 以官方 yolo11.yaml 为蓝本：第 0~22 层与 yolo11 逐层一致（骨干 + 完整
# PAN 颈部可整体继承官方预训练权重），在其后追加 FPN 式 P2 分支（P3 输出
# 上采样 + 骨干 P2 特征）作为第四个检测层。P2 分支宽度取 256（与 P3 输出
# 同宽），检测头内部通道与 yolo11 一致，P3~P5 检测分支权重可按层平移迁移。
# 平台以 yolo11n-p2.yaml / yolo11s-p2.yaml 等名称请求，ultralytics 自动
# 映射到本模板并按名称中的尺码字母取 scale。

# Parameters
nc: 80 # number of classes
scales: # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2 (backbone P2/4)
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 16 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, False]] # 19 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # cat head P5
  - [-1, 2, C3k2, [1024, True]] # 22 (P5/32-large)

  - [16, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]] # cat backbone P2
  - [-1, 2, C3k2, [256, False]] # 25 (P2/4-xsmall)

  - [[25, 16, 19, 22], 1, Detect, [nc]] # Detect(P2, P3, P4, P5)
