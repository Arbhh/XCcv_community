# XCcv 随包模板：YOLO11 小目标 P2 头实例分割模型（P2/4 - P5/32 四层输出）。
#
# 结构同 yolo11-p2.yaml（第 0~22 层与官方 yolo11-seg 逐层一致，可整体继承
# 预训练权重；追加 FPN 式 P2 分支作第四检测层）。分割头与官方一致
# Segment[nc, 32, 256]：原型网络取第一个输入（P2，宽度与 P3 相同），
# 原型掩码分辨率随之提升到 stride 2，微小缺陷的掩码边界更细。
# 平台以 yolo11n-seg-p2.yaml / yolo11s-seg-p2.yaml 等名称请求。

# Parameters
nc: 80 # number of classes
scales: # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2 (backbone P2/4)
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 16 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, False]] # 19 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # cat head P5
  - [-1, 2, C3k2, [1024, True]] # 22 (P5/32-large)

  - [16, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]] # cat backbone P2
  - [-1, 2, C3k2, [256, False]] # 25 (P2/4-xsmall)

  # Segment 头：proto 固定取第一个输入（Proto 仅上采样 ×2，stride8→掩码
  # stride4，须与训练 GT mask_ratio=4 匹配——若取 P2（stride4）掩码变
  # stride2，官方验证器 mask_iou 的 matmul 直接形状崩）；检测分支顺序
  # [P3, P2, P4, P5]，stride 按分支各自前向推断（无单调性假设）
  - [[16, 25, 19, 22], 1, Segment, [nc, 32, 256]] # Segment(P3proto; Det P3,P2,P4,P5)
