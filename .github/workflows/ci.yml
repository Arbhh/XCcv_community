name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

jobs:
  test:
    name: unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # Linux 无显示器环境运行 Qt/opencv 所需的系统库
      - name: Install system libs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglib2.0-0 libfontconfig1 libxkbcommon0 \
            libxkbcommon-x11-0 libdbus-1-3 libegl1

      # CPU 版 torch（体积小；ultralytics 8.4.7 约束 torch<2.10，与 CPU 源兼容）
      - name: Install torch (CPU)
        run: |
          python -m pip install --upgrade pip
          pip install "torch==2.9.1" "torchvision==0.24.1" --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax compile
        run: python -m compileall -q xccv labelme tools

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
